name: Build Android APK

on:
  push:
    branches: [main]
    paths: ["android/**", "web/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build APK
        run: gradle -p android assembleRelease --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk Jarvis.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-apk
          path: Jarvis.apk

      # A rolling "latest" release so the phone can download the APK directly.
      - name: Publish latest APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Jarvis (latest build)
          prerelease: true
          make_latest: false
          files: Jarvis.apk
          body: |
            Latest Jarvis build from `${{ github.sha }}`.
            Download **Jarvis.apk** on your Android phone, open it, and allow "Install unknown apps".
