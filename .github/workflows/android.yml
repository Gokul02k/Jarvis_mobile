name: Build Android APK

on:
  push:
    branches: [main]
    paths: ["android/**", "web/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build APK
        run: gradle -p android assembleRelease --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk Jarvis.apk

      # Read by the app's "Check for updates" button. Must match versionCode in build.gradle.kts.
      - name: Version manifest
        run: |
          notes="$(git log -1 --format=%B | grep -v -i '^co-authored-by' | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}')"
          jq -n \
            --argjson versionCode "$((100 + GITHUB_RUN_NUMBER))" \
            --argjson build "$GITHUB_RUN_NUMBER" \
            --arg sha "${GITHUB_SHA::7}" \
            --arg notes "$notes" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson size "$(stat -c %s Jarvis.apk)" \
            '{versionCode: $versionCode, build: $build, sha: $sha, notes: $notes, date: $date, size: $size}' > version.json
          cat version.json

      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-apk
          path: Jarvis.apk

      # A rolling "latest" release so the phone can download the APK directly.
      - name: Publish latest APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Jarvis (latest build)
          prerelease: true
          make_latest: false
          # APK first, then the manifest, so the app never sees a version the APK doesn't have yet.
          files: |
            Jarvis.apk
            version.json
          body: |
            Jarvis build ${{ github.run_number }} from `${{ github.sha }}`. Installed apps can update from **Settings → About → Update**.
            Download **Jarvis.apk** on your Android phone, open it, and allow "Install unknown apps".
